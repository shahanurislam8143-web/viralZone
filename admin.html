<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও ফ্লিক্স - অ্যাডমিন প্যানেল</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444;
            --success-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        
        h2 { margin-bottom: 20px; color: var(--accent-color); border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .section { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section h3 { margin-bottom: 15px; font-size: 18px; }
        
        input, textarea, select { width: 100%; padding: 10px; background: #334155; border: none; color: white; border-radius: 4px; margin-bottom: 12px; }
        button { background: var(--success-color); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button.danger { background: var(--accent-color); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; }
    </style>
</head>
<body>

    <h2>⚙️ VideoFlix Live Cloud Admin Dashboard</h2>

    <!-- ১. পেমেন্ট রিকোয়েস্ট সেকশন -->
    <div class="section">
        <h3>💰 ক্লাউড পেমেন্ট রিকোয়েস্ট</h3>
        <table>
            <thead>
                <tr>
                    <th>ইউজার নম্বর</th>
                    <th>TrxID</th>
                    <th>প্যাকেজ</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="adminPaymentTable"></tbody>
        </table>
    </div>

    <!-- ২. ভিডিও আপলোড সেকশন -->
    <div class="section">
        <h3>📤 লাইভ ভিডিও আপলোড করুন</h3>
        <input type="text" id="vidTitle" placeholder="ভিডিওর শিরোনাম">
        <select id="vidCategory">
            <option value="viral">ভাইরাল ভিডিও</option>
            <option value="trending">ট্রেণ্ডি ভিডিও</option>
            <option value="new">নতুন ভিডিও</option>
        </select>
        <input type="text" id="vidThumb" placeholder="থাম্বনেইল ইমেজ লিংক (URL)">
        <input type="text" id="vidUrl" placeholder="ভিডিওর লিংক (.mp4 বা স্ট্রিম লিংক)">
        <button onclick="uploadVideo()">ক্লাউডে ভিডিও পাবলিশ করুন</button>
    </div>

    <!-- ৩. পেমেন্ট নম্বর পরিবর্তন সেকশন -->
    <div class="section">
        <h3>💳 পেমেন্ট নম্বর পরিবর্তন</h3>
        <label style="font-size: 13px; color: var(--text-muted);">বর্তমান বিকাশ/নগদ নম্বর:</label>
        <input type="text" id="bkashNumber" placeholder="যেমন: 01700000000">
        <button onclick="saveSettings()">পেমেন্ট নম্বর সেভ করুন</button>
    </div>

    <!-- ৪. অ্যাড কোড পরিবর্তন সেকশন -->
    <div class="section">
        <h3>📢 অ্যাডস কোড ম্যানেজমেন্ট</h3>
        <textarea id="adScript" rows="5" placeholder="এখানে আপনার Monetag, Adsterra বা HTML Ad Code পেস্ট করুন"></textarea>
        <button onclick="saveAds()">অ্যাড কোড আপডেট করুন</button>
    </div>

    <script>
        const DB_URL = "https://viral-602ed-default-rtdb.firebaseio.com";

        // বর্তমান সেটিংস (বিকাশ নম্বর ও অ্যাড কোড) ডাটাবেজ থেকে লোড করা
        async function loadAdminSettings() {
            try {
                let res = await fetch(`${DB_URL}/settings.json`);
                let settings = await res.json();
                if(settings) {
                    if(settings.bkash) document.getElementById('bkashNumber').value = settings.bkash;
                    if(settings.adCode) document.getElementById('adScript').value = settings.adCode;
                }
            } catch(e) { console.error(e); }
        }

        // পেন্ডিং পেমেন্ট লোড করা
        async function fetchPendingPayments() {
            const tableBody = document.getElementById('adminPaymentTable');
            tableBody.innerHTML = '<tr><td colspan="4">লোডিং...</td></tr>';
            
            try {
                let res = await fetch(`${DB_URL}/payments.json`);
                let data = await res.json();

                tableBody.innerHTML = '';
                if(!data) {
                    tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">কোনো নতুন পেমেন্ট রিকোয়েস্ট নেই</td></tr>`;
                    return;
                }

                Object.keys(data).forEach(key => {
                    let item = data[key];
                    let planName = item.months == '1' ? '১ মাস (১০০৳)' : (item.months == '5' ? '৫ মাস (৩০০৳)' : '১ বছর (১০০০৳)');
                    
                    tableBody.innerHTML += `
                        <tr>
                            <td>${item.phone}</td>
                            <td>${item.trx}</td>
                            <td><b>${planName}</b></td>
                            <td>
                                <button onclick="approvePayment('${item.phone}', ${item.months})">অ্যাপ্রুভ</button>
                                <button class="danger" onclick="cancelPayment('${item.phone}')">ক্যান্সেল</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function approvePayment(phone, months) {
            const totalDays = parseInt(months) * 30;
            const expiryTimestamp = new Date().getTime() + (totalDays * 24 * 60 * 60 * 1000);
            
            await fetch(`${DB_URL}/approved_users/${phone}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, expiry: expiryTimestamp })
            });

            await fetch(`${DB_URL}/payments/${phone}.json`, { method: 'DELETE' });

            alert(`নম্বর ${phone} সফলভাবে VIP হিসেবে সক্রিয় করা হয়েছে!`);
            fetchPendingPayments();
        }

        async function cancelPayment(phone) {
            await fetch(`${DB_URL}/payments/${phone}.json`, { method: 'DELETE' });
            alert("পেমেন্ট বাতিল করা হয়েছে।");
            fetchPendingPayments();
        }

        // ১. ভিডিও আপলোড ফাংশন (Fixes applied)
        async function uploadVideo() {
            const title = document.getElementById('vidTitle').value.trim();
            const category = document.getElementById('vidCategory').value;
            const thumb = document.getElementById('vidThumb').value.trim();
            const url = document.getElementById('vidUrl').value.trim();

            if(!title || !url) {
                alert("দয়া করে ভিডিওর শিরোনাম এবং ভিডিও লিংক অবশ্যই দিন!");
                return;
            }

            const vidId = Date.now();
            try {
                await fetch(`${DB_URL}/videos/${vidId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: vidId,
                        title: title,
                        category: category,
                        thumb: thumb || 'https://via.placeholder.com/400x200',
                        url: url
                    })
                });

                alert("✅ ভিডিও ক্লাউডে সফলভাবে পাবলিশ করা হয়েছে!");
                document.getElementById('vidTitle').value = '';
                document.getElementById('vidThumb').value = '';
                document.getElementById('vidUrl').value = '';
            } catch(e) {
                alert("এরর: ভিডিও সেভ করা যায়নি!");
                console.error(e);
            }
        }

        // ২. পেমেন্ট নম্বর সেভ করার ফাংশন (Fixes applied)
        async function saveSettings() {
            const bkash = document.getElementById('bkashNumber').value.trim();
            if(!bkash) {
                alert("পেমেন্ট নম্বর দিন!");
                return;
            }

            try {
                await fetch(`${DB_URL}/settings/bkash.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bkash)
                });
                alert("✅ পেমেন্ট নম্বর সফলভাবে আপডেট করা হয়েছে!");
            } catch(e) {
                alert("এরর: পেমেন্ট নম্বর সেভ হয়নি!");
                console.error(e);
            }
        }

        // ৩. অ্যাড কোড সেভ করার ফাংশন (Fixes applied)
        async function saveAds() {
            const adCode = document.getElementById('adScript').value.trim();
            try {
                await fetch(`${DB_URL}/settings/adCode.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(adCode)
                });
                alert("✅ অ্যাড কোড সফলভাবে আপডেট করা হয়েছে!");
            } catch(e) {
                alert("এরর: অ্যাড কোড সেভ হয়নি!");
                console.error(e);
            }
        }

        // পেজ লোড হলে কল হবে
        loadAdminSettings();
        fetchPendingPayments();
    </script>
</body>
</html>
